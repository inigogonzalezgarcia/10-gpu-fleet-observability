# promtool test rules prometheus/tests/*.test.yml
# Each test feeds synthetic dcgm-exporter series and checks which alerts fire, and when.
rule_files:
  - ../rules/recording.yml
  - ../rules/alerts.yml
evaluation_interval: 30s

tests:
  - name: XID 79 pages immediately; an application XID (13) does not
    interval: 30s
    input_series:
      - series: 'DCGM_FI_DEV_XID_ERRORS{Hostname="gpu-node-2",gpu="3",UUID="GPU-b3"}'
        values: '0 0 79 79 79'
      - series: 'DCGM_FI_DEV_XID_ERRORS{Hostname="gpu-node-1",gpu="0",UUID="GPU-a0"}'
        values: '13x4'
    alert_rule_test:
      - eval_time: 30s
        alertname: GPUFellOffBus
        exp_alerts: []
      - eval_time: 1m
        alertname: GPUFellOffBus
        exp_alerts:
          - exp_labels: {severity: critical, action: drain, Hostname: gpu-node-2, gpu: "3", UUID: GPU-b3}
            exp_annotations:
              summary: "GPU 3 on gpu-node-2 fell off the bus (XID 79)"
              description: "The driver lost the GPU. Work on it is stuck. Drain the node, reset or reboot, then validate."
              runbook_url: "https://github.com/inigogonzalezgarcia/10-gpu-fleet-observability/blob/main/docs/alerts.md#gpufelloffbus"
      - eval_time: 2m
        alertname: GPUHardwareXID
        exp_alerts: []

  - name: Hardware XIDs, ECC and memory that cannot be repaired
    interval: 30s
    input_series:
      - series: 'DCGM_FI_DEV_XID_ERRORS{Hostname="gpu-node-1",gpu="1",UUID="GPU-a1"}'
        values: '74x4'
      - series: 'DCGM_FI_DEV_XID_ERRORS{Hostname="gpu-node-1",gpu="2",UUID="GPU-a2"}'
        values: '64x4'
      - series: 'DCGM_FI_DEV_ECC_DBE_VOL_TOTAL{Hostname="gpu-node-3",gpu="7",UUID="GPU-c7"}'
        values: '0 2 2 2'
      - series: 'DCGM_FI_DEV_ROW_REMAP_FAILURE{Hostname="gpu-node-4",gpu="0",UUID="GPU-d0"}'
        values: '0 0 1 1'
    alert_rule_test:
      - eval_time: 1m30s
        alertname: GPUHardwareXID
        exp_alerts:
          - exp_labels: {severity: critical, action: drain, Hostname: gpu-node-1, gpu: "1", UUID: GPU-a1}
            exp_annotations:
              summary: "XID 74 on GPU 1 of gpu-node-1"
              description: "A hardware-class XID that needs a GPU reset before the GPU can be trusted again."
              runbook_url: "https://github.com/inigogonzalezgarcia/10-gpu-fleet-observability/blob/main/docs/alerts.md#gpuhardwarexid"
      - eval_time: 1m30s
        alertname: GPUUncorrectableECC
        exp_alerts:
          - exp_labels: {severity: critical, action: drain, Hostname: gpu-node-3, gpu: "7", UUID: GPU-c7}
            exp_annotations:
              summary: "2 uncorrectable ECC error(s) on GPU 7 of gpu-node-3"
              description: "Double-bit ECC errors since the last reset. Results computed on this GPU may be wrong."
              runbook_url: "https://github.com/inigogonzalezgarcia/10-gpu-fleet-observability/blob/main/docs/alerts.md#gpuuncorrectableecc"
      - eval_time: 1m30s
        alertname: GPUMemoryUnrepairable
        exp_alerts:
          - exp_labels: {severity: critical, action: quarantine, Hostname: gpu-node-1, gpu: "2", UUID: GPU-a2}
            exp_annotations:
              summary: "GPU 2 on gpu-node-1 cannot repair its memory"
              description: "Row remapping failed or the single-bit error rate is high. Quarantine the node and open a hardware ticket (RMA)."
              runbook_url: "https://github.com/inigogonzalezgarcia/10-gpu-fleet-observability/blob/main/docs/alerts.md#gpumemoryunrepairable"
          - exp_labels: {severity: critical, action: quarantine, Hostname: gpu-node-4, gpu: "0", UUID: GPU-d0}
            exp_annotations:
              summary: "GPU 0 on gpu-node-4 cannot repair its memory"
              description: "Row remapping failed or the single-bit error rate is high. Quarantine the node and open a hardware ticket (RMA)."
              runbook_url: "https://github.com/inigogonzalezgarcia/10-gpu-fleet-observability/blob/main/docs/alerts.md#gpumemoryunrepairable"

  - name: Temperature warns after 5 minutes and pages after 2 minutes above 90°C
    interval: 1m
    input_series:
      - series: 'DCGM_FI_DEV_GPU_TEMP{Hostname="gpu-node-2",gpu="4",UUID="GPU-b4"}'
        values: '70 86 86 86 86 86 86 92 92 92 92'
    alert_rule_test:
      - eval_time: 5m
        alertname: GPUTemperatureHigh
        exp_alerts: []
      - eval_time: 6m
        alertname: GPUTemperatureHigh
        exp_alerts:
          - exp_labels: {severity: warning, Hostname: gpu-node-2, gpu: "4", UUID: GPU-b4}
            exp_annotations:
              summary: "GPU 4 on gpu-node-2 at 86°C"
              description: "Above 85°C for 5 minutes. Check airflow and the neighbours in the rack."
              runbook_url: "https://github.com/inigogonzalezgarcia/10-gpu-fleet-observability/blob/main/docs/alerts.md#gputemperaturehigh"
      - eval_time: 8m
        alertname: GPUTemperatureCritical
        exp_alerts: []
      - eval_time: 9m
        alertname: GPUTemperatureCritical
        exp_alerts:
          - exp_labels: {severity: critical, action: cordon, Hostname: gpu-node-2, gpu: "4", UUID: GPU-b4}
            exp_annotations:
              summary: "GPU 4 on gpu-node-2 at 92°C"
              description: "Above 90°C for 2 minutes: the GPU is throttling. Cordon the node so no new work lands on it."
              runbook_url: "https://github.com/inigogonzalezgarcia/10-gpu-fleet-observability/blob/main/docs/alerts.md#gputemperaturecritical"

  - name: NVLink errors must keep rising for 10 minutes
    interval: 1m
    input_series:
      # 300 errors per minute = 5/s for 20 minutes, then flat.
      - series: 'DCGM_FI_DEV_NVLINK_CRC_FLIT_ERROR_COUNT_TOTAL{Hostname="gpu-node-1",gpu="6",UUID="GPU-a6"}'
        values: '0+300x20 6000x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: NVLinkErrorsIncreasing
        exp_alerts: []
      - eval_time: 16m
        alertname: NVLinkErrorsIncreasing
        exp_alerts:
          - exp_labels: {severity: warning, Hostname: gpu-node-1, gpu: "6", UUID: GPU-a6}
            exp_annotations:
              summary: "NVLink CRC errors rising on GPU 6 of gpu-node-1"
              description: "5 errors/s for 10 minutes. Multi-GPU jobs on this node may slow down or fail."
              runbook_url: "https://github.com/inigogonzalezgarcia/10-gpu-fleet-observability/blob/main/docs/alerts.md#nvlinkerrorsincreasing"
      - eval_time: 35m
        alertname: NVLinkErrorsIncreasing
        exp_alerts: []

  - name: Exporter down for a minute pages
    interval: 30s
    input_series:
      - series: 'up{job="dcgm-exporter",instance="fleet-sim:9403",Hostname="gpu-node-3"}'
        values: '1 1 0 0 0 0'
    alert_rule_test:
      - eval_time: 1m30s
        alertname: GPUExporterDown
        exp_alerts: []
      - eval_time: 2m30s
        alertname: GPUExporterDown
        exp_alerts:
          - exp_labels: {severity: critical, job: dcgm-exporter, instance: "fleet-sim:9403", Hostname: gpu-node-3}
            exp_annotations:
              summary: "No GPU telemetry from gpu-node-3"
              description: "The exporter has not answered for 1 minute. Every other GPU alert for this node is blind."
              runbook_url: "https://github.com/inigogonzalezgarcia/10-gpu-fleet-observability/blob/main/docs/alerts.md#gpuexporterdown"

  - name: A GPU held by an idle pod is reported after 30 minutes; a busy or free one is not
    interval: 5m
    input_series:
      - series: 'DCGM_FI_DEV_GPU_UTIL{Hostname="gpu-node-4",gpu="2",UUID="GPU-d2",namespace="research",pod="notebook-a",container="main"}'
        values: '0x20'
      - series: 'DCGM_FI_DEV_GPU_UTIL{Hostname="gpu-node-1",gpu="0",UUID="GPU-a0",namespace="ml-training",pod="worker-0",container="main"}'
        values: '95x20'
      - series: 'DCGM_FI_DEV_GPU_UTIL{Hostname="gpu-node-4",gpu="7",UUID="GPU-d7"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 25m
        alertname: GPUAllocatedButIdle
        exp_alerts: []
      - eval_time: 35m
        alertname: GPUAllocatedButIdle
        exp_alerts:
          - exp_labels: {severity: info, Hostname: gpu-node-4, gpu: "2", UUID: GPU-d2, namespace: research, pod: notebook-a, container: main}
            exp_annotations:
              summary: "research/notebook-a holds GPU 2 on gpu-node-4 without using it"
              description: "Under 5% utilisation for at least 30 minutes. The GPU is reserved, so nobody else can use it."
              runbook_url: "https://github.com/inigogonzalezgarcia/10-gpu-fleet-observability/blob/main/docs/alerts.md#gpuallocatedbutidle"

  - name: Fleet capacity counts missing exporters as well as unhealthy GPUs
    interval: 1m
    input_series:
      # 2 nodes expected (16 GPUs); node b stops reporting at minute 3, node a has one GPU with ECC errors.
      - series: 'up{job="dcgm-exporter",Hostname="a"}'
        values: '1x12'
      - series: 'up{job="dcgm-exporter",Hostname="b"}'
        values: '1 1 1 0x9'
      - series: 'DCGM_FI_DEV_GPU_UTIL{Hostname="a",gpu="0"}'
        values: '50x12'
      - series: 'DCGM_FI_DEV_GPU_UTIL{Hostname="a",gpu="1"}'
        values: '50x12'
      - series: 'DCGM_FI_DEV_GPU_UTIL{Hostname="a",gpu="2"}'
        values: '50x12'
      - series: 'DCGM_FI_DEV_GPU_UTIL{Hostname="a",gpu="3"}'
        values: '50x12'
      - series: 'DCGM_FI_DEV_GPU_UTIL{Hostname="a",gpu="4"}'
        values: '50x12'
      - series: 'DCGM_FI_DEV_GPU_UTIL{Hostname="a",gpu="5"}'
        values: '50x12'
      - series: 'DCGM_FI_DEV_GPU_UTIL{Hostname="a",gpu="6"}'
        values: '50x12'
      - series: 'DCGM_FI_DEV_GPU_UTIL{Hostname="a",gpu="7"}'
        values: '50x12'
      - series: 'DCGM_FI_DEV_ECC_DBE_VOL_TOTAL{Hostname="a",gpu="7",UUID="GPU-a7"}'
        values: '1x12'
      - series: 'DCGM_FI_DEV_GPU_UTIL{Hostname="b",gpu="0"}'
        values: '50 50 50'
    promql_expr_test:
      - expr: fleet:gpus_healthy:ratio
        eval_time: 1m
        exp_samples:
          - labels: 'fleet:gpus_healthy:ratio'
            value: 0.5
      - expr: fleet:gpus_unhealthy:count
        eval_time: 1m
        exp_samples:
          - labels: 'fleet:gpus_unhealthy:count'
            value: 1
    alert_rule_test:
      - eval_time: 12m
        alertname: GPUFleetHealthyCapacityLow
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "Only 43.75% of the fleet's GPUs are healthy and reporting"
              description: "More than 10% of expected GPUs are unhealthy or missing. Check for a common cause (driver rollout, rack, power) before handling nodes one by one."
              runbook_url: "https://github.com/inigogonzalezgarcia/10-gpu-fleet-observability/blob/main/docs/alerts.md#gpufleethealthycapacitylow"
