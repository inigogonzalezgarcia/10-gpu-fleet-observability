# Lab configuration. Intervals are short so the end-to-end test runs in minutes;
# production values are in the comments.
global:
  scrape_interval: 5s        # production: 15s-30s (dcgm-exporter collects every 30s by default)
  evaluation_interval: 5s    # production: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # One target per GPU node. In Kubernetes this would be a PodMonitor/ServiceMonitor on the
  # dcgm-exporter DaemonSet; here the simulator serves each node on its own port.
  - job_name: dcgm-exporter
    # The exporter already sets Hostname on every series; keep it instead of renaming it to
    # exported_Hostname. The target label still lands on `up`, which has no exported labels.
    honor_labels: true
    static_configs:
      - targets: ["fleet-sim:9401"]
        labels: {Hostname: gpu-node-1}
      - targets: ["fleet-sim:9402"]
        labels: {Hostname: gpu-node-2}
      - targets: ["fleet-sim:9403"]
        labels: {Hostname: gpu-node-3}
      - targets: ["fleet-sim:9404"]
        labels: {Hostname: gpu-node-4}

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
